version: "2"

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - testableexamples
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - testifylint
    - tparallel
    - usetesting
    - sloglint
  settings:
    # An unchecked type assertion and an error assigned to _ are reported too.
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      # Fields keep the order of their role: no production struct has padding a reorder
      # removes, and the pointer-first order would only shorten what the garbage
      # collector scans.
      disable:
        - fieldalignment
    # Every check runs, the style checks the default skips included.
    staticcheck:
      checks: ["all"]
    revive:
      enable-all-rules: true
      rules:
        # Code counts with 0, 1 and 2, a string passed to calls up to three times stays
        # where it is written, and the literals of a test are its data.
        - name: add-constant
          exclude: ["TEST"]
          arguments:
            - allowInts: "0,1,2"
              maxLitCount: "3"
        # A switch lists the cases it acts on; exhaustive checks every enum switch.
        - name: enforce-switch-style
          arguments: ["allowNoDefault"]
        # A strings.Builder write never fails.
        - name: unhandled-error
          arguments:
            - "^strings\\.Builder\\.Write(Byte|Rune|String)?$"
        # One measure, one limit: the thresholds of gocognit, funlen and lll.
        - name: cognitive-complexity
          arguments: [20]
        - name: function-length
          arguments: [40, 60]
        - name: line-length-limit
          arguments: [120]
    # A naked return is reported in a function of any length.
    nakedret:
      max-func-lines: 0
    # A function with more than ten independent paths splits.
    gocyclo:
      min-complexity: 10
    # So does one whose cognitive complexity passes twenty.
    gocognit:
      min-complexity: 20
    goconst:
      # A string of two bytes or more repeated three times is a named constant.
      min-len: 2
      # The literals of a test are its data.
      ignore-tests: true
    # The performance, experimental and opinionated checks run beside the default ones.
    gocritic:
      enabled-tags:
        - performance
        - experimental
        - opinionated
    # Comments and identifiers use US spelling.
    misspell:
      locale: US
    # for loops get preallocation suggestions too, as range loops do.
    prealloc:
      for-loops: true
    # A directive names its linter and says why.
    nolintlint:
      require-explanation: true
      require-specific: true
    # A non-nil error prints with err.Error() rather than through fmt.
    perfsprint:
      err-error: true
    depguard:
      rules:
        # Tests assert with the standard library, never with testify.
        main:
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests assert with the standard library
        # Production code imports no unsafe.
        unsafe:
          files:
            - "!$test"
          deny:
            - pkg: unsafe
              desc: production code stays memory safe
        # A package imports only packages of lower layers.
        layer0:
          files:
            - "!$test"
            - "**/frontend/*.go"
            - "**/internal/config/*.go"
            - "**/internal/protocol/*.go"
          deny:
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/frontend$
              desc: layer 0 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/config$
              desc: layer 0 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/protocol$
              desc: layer 0 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/sshclient$
              desc: layer 0 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/session$
              desc: layer 0 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/server$
              desc: layer 0 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/cmd/ubyte-webssh-bridge$
              desc: layer 0 imports only lower layers
        layer1:
          files:
            - "!$test"
            - "**/internal/sshclient/*.go"
          deny:
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/sshclient$
              desc: layer 1 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/session$
              desc: layer 1 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/server$
              desc: layer 1 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/cmd/ubyte-webssh-bridge$
              desc: layer 1 imports only lower layers
        layer2:
          files:
            - "!$test"
            - "**/internal/session/*.go"
          deny:
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/session$
              desc: layer 2 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/server$
              desc: layer 2 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/cmd/ubyte-webssh-bridge$
              desc: layer 2 imports only lower layers
        layer3:
          files:
            - "!$test"
            - "**/internal/server/*.go"
          deny:
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/internal/server$
              desc: layer 3 imports only lower layers
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/cmd/ubyte-webssh-bridge$
              desc: layer 3 imports only lower layers
        layer4:
          files:
            - "!$test"
            - "**/cmd/ubyte-webssh-bridge/*.go"
          deny:
            - pkg: github.com/ubyte-source/ubyte-webssh-bridge/cmd/ubyte-webssh-bridge$
              desc: layer 4 imports only lower layers
        # Only the server and the session speak WebSocket.
        websocket:
          files:
            - "!$test"
            - "$all"
            - "!**/internal/server/*.go"
            - "!**/internal/session/*.go"
          deny:
            - pkg: github.com/coder/websocket
              desc: only internal/server and internal/session import coder/websocket
        # Only the SSH client uses x/crypto.
        crypto:
          files:
            - "!$test"
            - "$all"
            - "!**/internal/sshclient/*.go"
          deny:
            - pkg: golang.org/x/crypto
              desc: only internal/sshclient imports golang.org/x/crypto
        # Only the messages, the SSH client and the session hold secrets.
        authware:
          files:
            - "!$test"
            - "$all"
            - "!**/internal/protocol/*.go"
            - "!**/internal/sshclient/*.go"
            - "!**/internal/session/*.go"
          deny:
            - pkg: github.com/ubyte-source/go-authware
              desc: only internal/protocol, internal/sshclient and internal/session import go-authware
        # Only the messages use go-jsonfast.
        json:
          files:
            - "!$test"
            - "$all"
            - "!**/internal/protocol/*.go"
          deny:
            - pkg: github.com/ubyte-source/go-jsonfast
              desc: only internal/protocol imports go-jsonfast
    # A default is the branch for every other value, as Go's return rules want it.
    exhaustive:
      default-signifies-exhaustive: true
    # An import of an assertion module go.mod requires is reported.
    gomodguard_v2:
      blocked:
        - module: github.com/stretchr/testify
          match-type: prefix
          reason: tests assert with the standard library only
        - module: gotest.tools
          match-type: prefix
          reason: tests assert with the standard library only
        - module: github.com/onsi/gomega
          reason: tests assert with the standard library only
        - module: github.com/onsi/ginkgo
          match-type: prefix
          reason: tests assert with the standard library only
        - module: github.com/matryer/is
          reason: tests assert with the standard library only
    # Records go through a logger the code is given, as attributes with snake_case keys
    # and the context in scope; the key err is refused.
    sloglint:
      no-global: all
      context: scope
      attr-only: true
      key-naming-case: snake
      forbidden-keys:
        - err

formatters:
  enable:
    - gofmt
    - goimports
  # The imports of this module form the last group.
  settings:
    goimports:
      local-prefixes:
        - github.com/ubyte-source/ubyte-webssh-bridge

# Every hit is reported, several on one line included.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
