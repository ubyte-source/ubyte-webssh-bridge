version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]

  # Dependabot moves the digest of each pinned image; the golang tag moves by hand,
  # in the same change as go.mod.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # An update changes package.json and package-lock.json; its pull request passes
  # make vendor-check once the files make vendor writes are committed in it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      xterm:
        patterns: ["@xterm/*"]
